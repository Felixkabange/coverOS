services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: coveros
      POSTGRES_USER: coveros
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - coveros_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coveros -d coveros"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  coveros_postgres:
